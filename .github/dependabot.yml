version: 2
updates:
  # Every ecosystem groups its minor and patch bumps into ONE weekly PR and its security updates into
  # ONE security PR; major bumps stay separate so they get a dedicated review.

  # GitHub Actions: actions are pinned by commit SHA, Dependabot bumps the SHA and the version comment
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # .NET solution (Central Package Management, see ADR-001 and #7)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The platform targets .NET 10 LTS: the next major of the runtime-aligned packages is adopted
      # together with a target framework upgrade, not package by package. Security fixes ship on the
      # 10.x line (LTS servicing); a fix published only in a new major is caught by the NuGet audit.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]

  # Angular workspace in /web (ADR-001, #12).
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Angular and its lint tooling must move together (exact peer versions). Angular majors are
      # not grouped: they arrive as separate PRs and are applied with 'ng update' (migrations).
      angular:
        update-types: ["minor", "patch"]
        patterns: ["@angular/*", "angular-eslint", "@angular-eslint/*", "typescript-eslint"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # The Angular compiler pins TypeScript to a minor range (peer '>=6.0 <6.1'): TypeScript is
      # bumped by hand together with an Angular upgrade, never on its own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Container images (Dockerfiles, compose files) pinned by tag + digest (#7, #8).
  # Image tags declared in the Aspire AppHost C# code are not visible to Dependabot (see ADR-001).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/**"
    schedule:
      interval: "weekly"
    groups:
      docker:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
