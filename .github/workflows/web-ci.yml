name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: Web (lint, test, build, audit, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit dependencies (blocking on high and critical)
        run: npm audit --audit-level=high

      - name: Unit tests (CI scripts, node:test)
        run: npm run test:scripts

      - name: Check licenses
        run: npm run check:licenses

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check design token contrast (WCAG 2.1 AA)
        run: npm run check:contrast

      - name: Unit tests (Vitest + jsdom)
        run: npm run test:ci

      - name: Production build (bundle budgets enforced)
        run: npm run build -- --configuration production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore
          retention-days: 7
