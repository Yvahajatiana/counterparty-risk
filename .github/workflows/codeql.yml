name: CodeQL

# SAST with the security-extended query suite on C# (manual build) and JavaScript/TypeScript (web/), #8.
# Every action is pinned by full commit SHA (release tag in a trailing comment, bumped by Dependabot).
# CodeQL and Code scanning need a public repository or GitHub Code Security on a private one: the
# analysis runs once the repository variable CODE_SCANNING_ENABLED is set to true (or the repository is
# public), and is skipped otherwise so the pipeline stays green.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Setup .NET (global.json)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build (traced by CodeQL)
        if: matrix.language == 'csharp'
        run: dotnet build CounterpartyRisk.slnx -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
