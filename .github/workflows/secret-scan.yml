name: Secret & sensitive data scan

# Supply chain rule (ADR-001): every action is pinned by full commit SHA, with the
# release tag in a trailing comment so Dependabot (github-actions) can bump it.
# Gitleaks, TruffleHog and the forbidden files guard run as steps of ONE job (billed minutes are
# rounded up per job); every step runs even if a previous one failed, and any failure fails the job.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    # Draft PRs do not run CI; marking the PR ready for review triggers it
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The action lists the PR commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: TruffleHog (verified secrets)
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown

      - name: Forbidden files guard
        if: ${{ !cancelled() }}
        run: |
          # Block files that must never be versioned (EDB, CV, keys, env files, dumps)
          found=$(git ls-files | grep -Ei '(expression des besoins|(^|/)edb[^/]*\.md$|\.pdf$|\.pfx$|\.p12$|\.pem$|\.key$|(^|/)\.env($|\.)|\.tfstate|\.dump$|\.bak$)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Forbidden files are tracked:"
            echo "$found"
            exit 1
          fi
          echo "No forbidden files tracked."
