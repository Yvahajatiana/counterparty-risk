name: Secret & sensitive data scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  trufflehog:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  forbidden-files:
    name: Forbidden files guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on private documents or key material
        run: |
          # Block files that must never be versioned (EDB, CV, keys, env files, dumps)
          found=$(git ls-files | grep -Ei '(expression des besoins|\.pdf$|\.pfx$|\.p12$|\.pem$|\.key$|(^|/)\.env($|\.)|\.tfstate|\.dump$|\.bak$)' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Forbidden files are tracked:"
            echo "$found"
            exit 1
          fi
          echo "No forbidden files tracked."
