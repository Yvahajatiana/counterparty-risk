title = "counterparty-risk gitleaks config"

# Keep all default gitleaks rules (cloud keys, tokens, private keys...)
[extend]
useDefault = true

# ---- Sensitive data rules specific to a banking / CCR context ----

[[rules]]
id = "iban"
description = "IBAN number"
regex = '''\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]{4}){3,7}(?:[ ]?[A-Z0-9]{1,3})?\b'''
keywords = ["iban", "fr76", "de89", "gb29"]
tags = ["pii", "banking"]

[[rules]]
id = "french-phone-number"
description = "French phone number"
regex = '''(?:\+33[ .]?|\b0)[1-9](?:[ .-]?[0-9]{2}){4}\b'''
tags = ["pii"]

[[rules]]
id = "connection-string-password"
description = "Connection string with inline password"
regex = '''(?i)(?:password|pwd)\s*=\s*[^;"'\s]{4,}'''
keywords = ["password", "pwd"]
tags = ["secret"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]
tags = ["secret"]

[allowlist]
description = "Test fixtures and documentation placeholders"
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)testdata/''',
]
regexes = [
  '''(?i)password\s*=\s*(\$\{[^}]+\}|<[^>]+>|changeme|__REPLACE__)''',
]
