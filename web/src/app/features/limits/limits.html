<app-widget-header [widget]="widget" [quality]="data.value()?.quality" />
<app-load-state [loading]="data.isLoading()" [error]="data.error()" />

@if (data.value(); as d) {
  <p class="cr-text-muted mb-4">
    Counterparty limits on peak PFE. Thresholds: warning from {{ d.thresholds.warning | pct }},
    breach from {{ d.thresholds.breach | pct }}. {{ breaches() }} counterparties in breach.
  </p>
  <div class="grid gap-4 xl:grid-cols-2">
    <section class="cr-card" aria-labelledby="utilisation">
      <h2 id="utilisation" class="cr-section-title">Limit utilisation by counterparty</h2>
      <app-horizontal-bar-chart
        title="Utilisation of the peak PFE limit"
        level="AfterCollateral"
        family="Economic"
        seriesName="Utilisation"
        [items]="utilisation()"
        [thresholds]="thresholds()"
        [height]="380"
        description="Limit utilisation by counterparty, in percent, with warning and breach thresholds"
      />
    </section>
    <section class="cr-card" aria-labelledby="history">
      <h2 id="history" class="cr-section-title">Utilisation over the last 3 months (top 3)</h2>
      <app-line-chart
        title="Utilisation of the peak PFE limit"
        level="AfterCollateral"
        unit="percent"
        xKind="date"
        [series]="history()"
        [limits]="[{ value: thresholds().breach, kind: 'breach', label: 'Limit' }]"
        [height]="380"
        description="Limit utilisation history of the three most used limits, in percent"
      />
    </section>
  </div>

  <section class="cr-card mt-4" aria-label="Limits and headroom">
    <app-data-grid
      title="Limits and headroom (EUR m)"
      level="AfterCollateral"
      [rows]="d.rows"
      [columns]="columns()"
      [getRowId]="rowId"
      [rowStatus]="rowStatus()"
      [exportId]="{ widgetId: 'W4', tableId: 'limits' }"
      [asOfDate]="d.quality.asOfDate"
    />
  </section>
}
