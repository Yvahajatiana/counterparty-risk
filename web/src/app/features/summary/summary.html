<app-widget-header [widget]="widget" [quality]="summary.value()?.quality" />
<app-load-state [loading]="summary.isLoading()" [error]="summary.error()" />

@if (summary.value(); as data) {
  <ul class="cr-tiles" aria-label="Key indicators">
    @for (tile of data.tiles; track tile.code) {
      <li>
        <app-kpi-tile
          [label]="tile.label"
          [value]="tile.value"
          [unit]="tile.unit === 'count' ? 'count' : 'money'"
          [currency]="data.quality.reportingCurrency"
          [level]="tile.level"
          [vision]="tile.vision"
          [route]="tile.route"
          [breakdown]="tile.breakdown"
          [status]="tile.status"
          [previousDay]="tile.previousDay"
          [previousMonth]="tile.previousMonth"
        />
      </li>
    }
  </ul>
}
