# Demo stack (front-end driven development): Angular + BFF on synthetic data.
#   docker compose up --build -d   then open http://localhost:8080
#   docker compose down
# The Api, PostgreSQL and Keycloak join this file as the mocks are replaced.
# Since #9 the BFF requires an OIDC issuer and its client secret (fail closed, even for the mocks):
# export CCR_OIDC_AUTHORITY (HTTPS realm URL) and CCR_BFF_CLIENT_SECRET before starting. A Keycloak
# service in this file is a follow-up; the full local stack runs with the Aspire AppHost.
name: counterparty-risk

services:
  bff:
    build:
      context: .
      dockerfile: src/CounterpartyRisk.Bff/Dockerfile
    image: counterparty-risk/bff:demo
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Bff__UseMockData: "true"
      Authentication__Authority: ${CCR_OIDC_AUTHORITY:?set CCR_OIDC_AUTHORITY to the realm URL}
      Authentication__ClientSecret: ${CCR_BFF_CLIENT_SECRET:?set CCR_BFF_CLIENT_SECRET}
      # Demo only: key ring on tmpfs, sessions are lost on restart (PostgreSQL key ring with #11).
      Bff__DataProtection__KeysPath: /tmp/dpkeys
    ports:
      # Loopback only: the demo is not exposed on the network.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
